<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Strava Wrapped</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: #000000;
        --text: #f9fafb;
        --muted: #9ca3af;
        --accent-pink: #ec4899;
        --accent-orange: #f97316;
        --accent-yellow: #facc15;
        --accent-cyan: #22d3ee;
        --accent-green: #22c55e;
        --accent-blue: #6366f1;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 0% 0%, #f97316 0, transparent 45%),
          radial-gradient(circle at 100% 0%, #22c55e 0, transparent 45%),
          radial-gradient(circle at 0% 100%, #6366f1 0, transparent 50%),
          radial-gradient(circle at 100% 100%, #ec4899 0, #000 65%);
        display: flex;
        align-items: stretch;
        justify-content: center;
      }

      .shell {
        width: 100%;
        max-width: 1100px;
        padding: 16px;
        margin: auto;
      }

      .card {
        width: 100%;
        min-height: min(700px, 100vh - 32px);
        border-radius: 40px;
        padding: 22px 22px 18px;
        display: flex;
        flex-direction: column;
        background: #000;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.95);
        position: relative;
        overflow: hidden;
      }

      .card::before,
      .card::after {
        content: "";
        position: absolute;
        pointer-events: none;
        z-index: 0;
      }

      .card::before {
        inset: -40%;
        background:
          conic-gradient(
            from 150deg,
            rgba(250, 204, 21, 0.9),
            rgba(34, 211, 238, 0.9),
            rgba(236, 72, 153, 0.9),
            rgba(99, 102, 241, 0.9),
            rgba(249, 115, 22, 0.9),
            rgba(250, 204, 21, 0.9)
          );
        opacity: 0.45;
        filter: blur(30px);
      }

      .card::after {
        inset: 16px;
        border-radius: 32px;
        background: radial-gradient(circle at 0% 0%, rgba(248, 250, 252, 0.1), transparent 45%),
          radial-gradient(circle at 100% 100%, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 1));
        border: 1px solid rgba(148, 163, 184, 0.4);
      }

      .card-inner {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .header-row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-start;
        margin-bottom: 18px;
      }

      .heading-block {
        max-width: 70%;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        font-size: 10px;
        color: var(--muted);
        margin-bottom: 12px;
      }

      .pill-dot {
        width: 14px;
        height: 14px;
        border-radius: 999px;
        background: radial-gradient(circle at 30% 30%, #fff, #f97316, #ec4899);
      }

      h1 {
        font-size: 36px;
        line-height: 1.05;
        margin: 0 0 6px;
      }

      .sub {
        font-size: 14px;
        color: var(--muted);
        margin: 0;
      }

      .login-wrapper {
        margin-top: 6px;
        display: flex;
        align-items: flex-start;
        justify-content: flex-end;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 24px;
        border-radius: 999px;
        border: none;
        outline: none;
        text-decoration: none;
        font-size: 14px;
        font-weight: 700;
        color: #020617;
        background-image: linear-gradient(
          135deg,
          #f9fafb,
          #fbbf24,
          #22c55e
        );
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.95);
        cursor: pointer;
        white-space: nowrap;
      }

      .btn span:first-child {
        margin-right: 8px;
        font-size: 18px;
      }

      .slides-shell {
        flex: 1;
        display: flex;
        flex-direction: column;
        margin-top: 10px;
      }

      .slides-frame {
        position: relative;
        flex: 1;
        overflow: hidden;
        border-radius: 30px;
        padding: 18px 18px 20px;
        min-height: 270px;
      }

      .slides-container {
        position: relative;
        height: 100%;
      }

      .slide {
        opacity: 0;
        pointer-events: none;
        position: absolute;
        inset: 0;
        transition: opacity 260ms ease-out;
        display: flex;
      }

      .slide.active {
        opacity: 1;
        pointer-events: auto;
        position: relative;
      }

      .slide-inner {
        border-radius: 26px;
        background: #020617;
        border: 2px solid #020617;
        padding: 20px 22px 18px;
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }

      .slide-inner::before,
      .slide-inner::after {
        content: "";
        position: absolute;
        pointer-events: none;
        opacity: 0.85;
        mix-blend-mode: screen;
      }

      .slide-inner--overview::before {
        inset: -40%;
        background: linear-gradient(135deg, #f97316, #ec4899, #22d3ee);
      }

      .slide-inner--fastest::before {
        inset: -40%;
        background: linear-gradient(145deg, #ec4899, #6366f1, #22c55e);
      }

      .slide-inner--longrun::before {
        inset: -40%;
        background: linear-gradient(155deg, #22d3ee, #6366f1, #facc15);
      }

      .slide-inner--ride::before {
        inset: -40%;
        background: linear-gradient(160deg, #22c55e, #0ea5e9, #f97316);
      }

      .slide-inner--climb::before {
        inset: -40%;
        background: linear-gradient(150deg, #6366f1, #f97316, #facc15);
      }

      .slide-inner::after {
        inset: 10px;
        border-radius: 20px;
        background: radial-gradient(circle at 0% 0%, rgba(0, 0, 0, 0.7), transparent 55%),
          radial-gradient(circle at 100% 100%, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 1));
      }

      .slide-content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .slide-top {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        align-items: flex-start;
        flex: 1;
      }

      .slide-text-block {
        flex: 2;
        min-width: 210px;
      }

      .slide-side-block {
        flex: 1.3;
        min-width: 140px;
        display: flex;
        justify-content: flex-end;
        align-items: center;
      }

      .slide-tag {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.22em;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .slide-title {
        font-size: 22px;
        font-weight: 800;
        margin-bottom: 8px;
      }

      .slide-main {
        font-size: 38px;
        font-weight: 900;
        margin-bottom: 6px;
      }

      .slide-sub {
        font-size: 14px;
        color: var(--muted);
      }

      .stat-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
        gap: 8px 14px;
        margin-top: 12px;
        font-size: 13px;
        color: var(--muted);
      }

      .stat-list strong {
        color: var(--text);
        font-weight: 650;
      }

      .slides-footer {
        margin-top: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .dots {
        display: flex;
        gap: 6px;
        align-items: center;
        justify-content: center;
        flex: 1;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        border: none;
        padding: 0;
        background: rgba(148, 163, 184, 0.7);
        cursor: pointer;
      }

      .dot.active {
        width: 22px;
        background: #f9fafb;
      }

      .slides-hint {
        font-size: 11px;
        color: var(--muted);
        text-align: right;
      }

      .route-map {
        width: 100%;
        max-width: 260px;
        aspect-ratio: 4 / 3;
        border-radius: 22px;
        background: radial-gradient(circle at 0% 0%, #22d3ee, #020617 70%);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.9);
      }

      .route-map-bg {
        fill: rgba(15, 23, 42, 0.95);
      }

      .route-map-path {
        fill: none;
        stroke: #facc15;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .route-map-overlay {
        fill: none;
        stroke: rgba(15, 23, 42, 0.9);
        stroke-width: 0.6;
      }

      .error {
        color: #fecaca;
        font-size: 13px;
        margin-top: 6px;
      }

      .footer {
        margin-top: 12px;
        font-size: 11px;
        color: var(--muted);
      }

      @media (max-width: 768px) {
        .shell {
          padding: 10px;
        }
        .card {
          border-radius: 32px;
          padding: 18px 14px 14px;
          min-height: calc(100vh - 20px);
        }
        .heading-block {
          max-width: 100%;
        }
        h1 {
          font-size: 28px;
        }
        .slide-main {
          font-size: 30px;
        }
        .slide-title {
          font-size: 18px;
        }
        .slides-frame {
          padding: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <section class="card">
        <div class="card-inner">
          <header class="header-row">
            <div class="heading-block">
              <div class="pill">
                <span class="pill-dot"></span>
                <span>Strava Wrapped · Last 12 months</span>
              </div>
              <h1 id="title">Loading your year in motion…</h1>
              <p id="subtitle" class="sub"></p>
            </div>
            <div id="login-section" class="login-wrapper" style="display: none;">
              <button id="login-btn" class="btn">
                <span>🎧</span> <span>Log in with Strava</span>
              </button>
            </div>
          </header>

          <main id="slides-shell" class="slides-shell" style="display: none;">
            <div class="slides-frame" id="slides-frame">
              <div id="slides-container" class="slides-container"></div>
              <div class="slides-footer">
                <div id="dots" class="dots"></div>
                <div class="slides-hint">
                  Auto-advancing · swipe left/right or tap dots →
                </div>
              </div>
            </div>
          </main>

          <div id="error" class="error"></div>

          <footer class="footer">
            Prototype only. Uses Strava OAuth with tokens stored in a secure HttpOnly
            cookie via Netlify Functions. Distances in miles, pace in min/mi.
          </footer>
        </div>
      </section>
    </div>

    <script>
      const loginBtn = document.getElementById("login-btn");
      const loginSection = document.getElementById("login-section");
      const slidesShell = document.getElementById("slides-shell");
      const slidesContainer = document.getElementById("slides-container");
      const dotsContainer = document.getElementById("dots");
      const titleEl = document.getElementById("title");
      const subtitleEl = document.getElementById("subtitle");
      const errorEl = document.getElementById("error");
      const slidesFrameEl = document.getElementById("slides-frame");

      let slides = [];
      let currentIndex = 0;
      let autoTimer = null;

      function metersToMiles(meters) {
        return meters / 1609.34;
      }

      function formatMiles(meters, decimals = 1) {
        return metersToMiles(meters).toFixed(decimals);
      }

      function formatHours(seconds) {
        return (seconds / 3600).toFixed(1);
      }

      function formatPaceFromSecPerKm(secPerKm) {
        if (!secPerKm || !isFinite(secPerKm)) return "-";
        const secPerMile = secPerKm * 1.609344;
        const minTotal = secPerMile / 60;
        const min = Math.floor(minTotal);
        const sec = Math.round((minTotal - min) * 60)
          .toString()
          .padStart(2, "0");
        return `${min}:${sec} / mi`;
      }

      function monthLabel(ym) {
        const [year, m] = ym.split("-");
        const monthNames = [
          "Jan",
          "Feb",
          "Mar",
          "Apr",
          "May",
          "Jun",
          "Jul",
          "Aug",
          "Sep",
          "Oct",
          "Nov",
          "Dec"
        ];
        return `${monthNames[parseInt(m, 10) - 1]} ${year}`;
      }

      // Polyline decode
      function decodePolyline(str) {
        const coords = [];
        let index = 0;
        let lat = 0;
        let lng = 0;

        while (index < str.length) {
          let result = 0;
          let shift = 0;
          let b;
          do {
            b = str.charCodeAt(index++) - 63;
            result |= (b & 0x1f) << shift;
            shift += 5;
          } while (b >= 0x20);
          const dlat = (result & 1) ? ~(result >> 1) : (result >> 1);
          lat += dlat;

          result = 0;
          shift = 0;
          do {
            b = str.charCodeAt(index++) - 63;
            result |= (b & 0x1f) << shift;
            shift += 5;
          } while (b >= 0x20);
          const dlng = (result & 1) ? ~(result >> 1) : (result >> 1);
          lng += dlng;

          coords.push([lat * 1e-5, lng * 1e-5]);
        }

        return coords;
      }

      function renderPolylineToSvg(polyline, svgId) {
        if (!polyline) return;
        const svg = document.getElementById(svgId);
        if (!svg) return;

        let coords;
        try {
          coords = decodePolyline(polyline);
        } catch (e) {
          console.warn("Failed to decode polyline", e);
          return;
        }
        if (!coords.length) return;

        let minLat = Infinity,
          maxLat = -Infinity,
          minLng = Infinity,
          maxLng = -Infinity;
        for (const [lat, lng] of coords) {
          if (lat < minLat) minLat = lat;
          if (lat > maxLat) maxLat = lat;
          if (lng < minLng) minLng = lng;
          if (lng > maxLng) maxLng = lng;
        }

        const width = 100;
        const height = 60;
        const lngSpan = maxLng - minLng || 1;
        const latSpan = maxLat - minLat || 1;

        const d = coords
          .map(([lat, lng], idx) => {
            const x = ((lng - minLng) / lngSpan) * width;
            const y = height - ((lat - minLat) / latSpan) * height;
            return `${idx === 0 ? "M" : "L"} ${x.toFixed(2)} ${y.toFixed(2)}`;
          })
          .join(" ");

        const path = svg.querySelector(".route-map-path");
        if (path) {
          path.setAttribute("d", d);
        }
      }

      function buildSlides(athleteName, stats) {
        const s = [];
        const milesTotal = formatMiles(stats.totalDistance, 1);
        const hoursTotal = formatHours(stats.totalMovingTime);

        s.push({
          id: "overview",
          html: `
            <div class="slide-inner slide-inner--overview">
              <div class="slide-content">
                <div class="slide-top">
                  <div class="slide-text-block">
                    <div class="slide-tag">Overview</div>
                    <div class="slide-title">${
                      athleteName || "Athlete"
                    }, your 12-month recap.</div>
                    <div class="slide-main">${milesTotal} miles</div>
                    <div class="slide-sub">
                      logged across your runs and rides — about ${hoursTotal} hours on the move.
                    </div>
                    <div class="stat-list">
                      <div><strong>Total time</strong><br>${hoursTotal} hours moving</div>
                      ${
                        stats.peakMonth
                          ? `<div><strong>Peak month</strong><br>${monthLabel(
                              stats.peakMonth
                            )} · ${formatMiles(
                              stats.peakDistance,
                              1
                            )} mi</div>`
                          : ""
                      }
                      ${
                        stats.fastestRun
                          ? `<div><strong>Fastest effort</strong><br>${
                              stats.fastestRun.name || "Fastest run"
                            }</div>`
                          : ""
                      }
                    </div>
                  </div>
                </div>
              </div>
            </div>
          `
        });

        if (stats.fastestRun && stats.fastestPace) {
          s.push({
            id: "fastest-run",
            html: `
              <div class="slide-inner slide-inner--fastest">
                <div class="slide-content">
                  <div class="slide-top">
                    <div class="slide-text-block">
                      <div class="slide-tag">Fastest Run</div>
                      <div class="slide-title">${
                        stats.fastestRun.name || "Fastest run"
                      }</div>
                      <div class="slide-main">${formatPaceFromSecPerKm(
                        stats.fastestPace
                      )}</div>
                      <div class="slide-sub">
                        over ${formatMiles(
                          stats.fastestRun.distance,
                          1
                        )} miles. This was your sharpest speed of the year.
                      </div>
                      <div class="stat-list">
                        <div><strong>Distance</strong><br>${formatMiles(
                          stats.fastestRun.distance,
                          2
                        )} mi</div>
                        <div><strong>Elevation</strong><br>${
                          stats.fastestRun.total_elevation_gain
                            ? Math.round(
                                stats.fastestRun.total_elevation_gain *
                                  3.28084
                              ) + " ft"
                            : "—"
                        }</div>
                      </div>
                    </div>
                    <div class="slide-side-block">
                      ${
                        stats.fastestRun.map &&
                        stats.fastestRun.map.summary_polyline
                          ? `
                        <svg id="map-fastest-run" class="route-map" viewBox="0 0 100 60" preserveAspectRatio="xMidYMid meet">
                          <rect class="route-map-bg" x="0" y="0" width="100" height="60"></rect>
                          <path class="route-map-path" d=""></path>
                          <path class="route-map-overlay" d=""></path>
                        </svg>
                      `
                          : "<div class='slide-sub'>No route map available for this effort.</div>"
                      }
                    </div>
                  </div>
                </div>
              </div>
            `
          });
        }

        if (stats.longestRun) {
          s.push({
            id: "longest-run",
            html: `
              <div class="slide-inner slide-inner--longrun">
                <div class="slide-content">
                  <div class="slide-top">
                    <div class="slide-text-block">
                      <div class="slide-tag">Endurance</div>
                      <div class="slide-title">${
                        stats.longestRun.name || "Longest run"
                      }</div>
                      <div class="slide-main">${formatMiles(
                        stats.longestRun.distance,
                        2
                      )} miles</div>
                      <div class="slide-sub">
                        Your single longest run of the year — the day you just kept going.
                      </div>
                      <div class="stat-list">
                        <div><strong>Elevation gain</strong><br>${
                          stats.longestRun.total_elevation_gain
                            ? Math.round(
                                stats.longestRun.total_elevation_gain *
                                  3.28084
                              ) + " ft"
                            : "—"
                        }</div>
                        <div><strong>Type</strong><br>${
                          stats.longestRun.type || "Run"
                        }</div>
                      </div>
                    </div>
                    <div class="slide-side-block">
                      ${
                        stats.longestRun.map &&
                        stats.longestRun.map.summary_polyline
                          ? `
                        <svg id="map-longest-run" class="route-map" viewBox="0 0 100 60" preserveAspectRatio="xMidYMid meet">
                          <rect class="route-map-bg" x="0" y="0" width="100" height="60"></rect>
                          <path class="route-map-path" d=""></path>
                          <path class="route-map-overlay" d=""></path>
                        </svg>
                      `
                          : "<div class='slide-sub'>No route map available for this run.</div>"
                      }
                    </div>
                  </div>
                </div>
              </div>
            `
          });
        }

        if (stats.longestRide) {
          s.push({
            id: "longest-ride",
            html: `
              <div class="slide-inner slide-inner--ride">
                <div class="slide-content">
                  <div class="slide-top">
                    <div class="slide-text-block">
                      <div class="slide-tag">Big Ride</div>
                      <div class="slide-title">${
                        stats.longestRide.name || "Longest ride"
                      }</div>
                      <div class="slide-main">${formatMiles(
                        stats.longestRide.distance,
                        2
                      )} miles</div>
                      <div class="slide-sub">
                        Your longest day in the saddle — the ride that defined your year on two wheels.
                      </div>
                      <div class="stat-list">
                        <div><strong>Elevation gain</strong><br>${
                          stats.longestRide.total_elevation_gain
                            ? Math.round(
                                stats.longestRide.total_elevation_gain *
                                  3.28084
                              ) + " ft"
                            : "—"
                        }</div>
                        <div><strong>Type</strong><br>${
                          stats.longestRide.type || "Ride"
                        }</div>
                      </div>
                    </div>
                    <div class="slide-side-block">
                      ${
                        stats.longestRide.map &&
                        stats.longestRide.map.summary_polyline
                          ? `
                        <svg id="map-longest-ride" class="route-map" viewBox="0 0 100 60" preserveAspectRatio="xMidYMid meet">
                          <rect class="route-map-bg" x="0" y="0" width="100" height="60"></rect>
                          <path class="route-map-path" d=""></path>
                          <path class="route-map-overlay" d=""></path>
                        </svg>
                      `
                          : "<div class='slide-sub'>No route map available for this ride.</div>"
                      }
                    </div>
                  </div>
                </div>
              </div>
            `
          });
        }

        if (stats.highestElev) {
          s.push({
            id: "biggest-climb",
            html: `
              <div class="slide-inner slide-inner--climb">
                <div class="slide-content">
                  <div class="slide-top">
                    <div class="slide-text-block">
                      <div class="slide-tag">Biggest Climb Day</div>
                      <div class="slide-title">${
                        stats.highestElev.name || "Biggest climb"
                      }</div>
                      <div class="slide-main">${Math.round(
                        stats.highestElev.total_elevation_gain * 3.28084
                      )} ft</div>
                      <div class="slide-sub">
                        The day you climbed the most vertical — legs screaming, views earned.
                      </div>
                      <div class="stat-list">
                        <div><strong>Distance</strong><br>${formatMiles(
                          stats.highestElev.distance,
                          2
                        )} mi</div>
                        <div><strong>Type</strong><br>${
                          stats.highestElev.type || "Activity"
                        }</div>
                      </div>
                    </div>
                    <div class="slide-side-block">
                      ${
                        stats.highestElev.map &&
                        stats.highestElev.map.summary_polyline
                          ? `
                        <svg id="map-biggest-climb" class="route-map" viewBox="0 0 100 60" preserveAspectRatio="xMidYMid meet">
                          <rect class="route-map-bg" x="0" y="0" width="100" height="60"></rect>
                          <path class="route-map-path" d=""></path>
                          <path class="route-map-overlay" d=""></path>
                        </svg>
                      `
                          : "<div class='slide-sub'>No route map available for this climb day.</div>"
                      }
                    </div>
                  </div>
                </div>
              </div>
            `
          });
        }

        return s;
      }

      function renderSlides(slideDefs) {
        slides = slideDefs;
        currentIndex = 0;

        slidesContainer.innerHTML = slideDefs
          .map(
            (s, idx) => `
          <section class="slide ${idx === 0 ? "active" : ""}" data-index="${idx}">
            ${s.html}
          </section>
        `
          )
          .join("");

        dotsContainer.innerHTML = slideDefs
          .map(
            (_, idx) =>
              `<button class="dot ${idx === 0 ? "active" : ""}" data-index="${idx}"></button>`
          )
          .join("");

        const dots = Array.from(dotsContainer.querySelectorAll(".dot"));
        dots.forEach((dot) => {
          dot.addEventListener("click", () => {
            const i = Number(dot.getAttribute("data-index"));
            goToSlide(i, true);
          });
        });

        if (autoTimer) clearInterval(autoTimer);
        autoTimer = setInterval(() => {
          goToSlide((currentIndex + 1) % slides.length, false);
        }, 6500);
      }

      function goToSlide(index, fromUser) {
        if (!slides.length) return;
        if (index < 0) index = slides.length - 1;
        if (index >= slides.length) index = 0;
        currentIndex = index;

        const slideEls = Array.from(slidesContainer.querySelectorAll(".slide"));
        slideEls.forEach((el, idx) => {
          el.classList.toggle("active", idx === currentIndex);
        });

        const dotEls = Array.from(dotsContainer.querySelectorAll(".dot"));
        dotEls.forEach((el, idx) => {
          el.classList.toggle("active", idx === currentIndex);
        });

        if (fromUser && autoTimer) {
          clearInterval(autoTimer);
          autoTimer = setInterval(() => {
            goToSlide((currentIndex + 1) % slides.length, false);
          }, 6500);
        }
      }

      // Swipe handling
      let touchStartX = 0;
      let touchStartY = 0;
      let touchEndX = 0;
      let touchEndY = 0;

      function handleTouchStart(e) {
        if (!e.touches || !e.touches.length) return;
        const t = e.touches[0];
        touchStartX = t.clientX;
        touchStartY = t.clientY;
        touchEndX = t.clientX;
        touchEndY = t.clientY;
      }

      function handleTouchMove(e) {
        if (!e.touches || !e.touches.length) return;
        const t = e.touches[0];
        touchEndX = t.clientX;
        touchEndY = t.clientY;
      }

      function handleTouchEnd() {
        const dx = touchEndX - touchStartX;
        const dy = touchEndY - touchStartY;
        const threshold = 40;

        if (Math.abs(dx) > threshold && Math.abs(dx) > Math.abs(dy)) {
          if (dx < 0) {
            goToSlide(currentIndex + 1, true); // swipe left → next
          } else {
            goToSlide(currentIndex - 1, true); // swipe right → prev
          }
        }
      }

      if (slidesFrameEl) {
        slidesFrameEl.addEventListener("touchstart", handleTouchStart, {
          passive: true
        });
        slidesFrameEl.addEventListener("touchmove", handleTouchMove, {
          passive: true
        });
        slidesFrameEl.addEventListener("touchend", handleTouchEnd);
      }

      async function loadStats() {
        errorEl.textContent = "";
        loginSection.style.display = "none";
        slidesShell.style.display = "none";

        try {
          const res = await fetch("/.netlify/functions/strava?mode=stats", {
            credentials: "include"
          });

          if (res.status === 401) {
            titleEl.textContent = "Your Strava Wrapped";
            subtitleEl.textContent =
              "Tap to connect Strava and watch your recap unfold, Spotify Wrapped–style.";
            loginSection.style.display = "block";
            return;
          }

          if (!res.ok) {
            throw new Error("Failed to load stats");
          }

          const data = await res.json();
          const { athleteName, stats } = data;

          titleEl.textContent = `${athleteName || "Athlete"}, this is your year in motion.`;
          subtitleEl.textContent =
            "Swipe through bold cards of your total miles, fastest run, longest days, and biggest climbs.";

          const defs = buildSlides(athleteName, stats);
          if (!defs.length) {
            subtitleEl.textContent =
              "We couldn't find enough activity data for the last year. Try again after you log more workouts.";
            return;
          }

          renderSlides(defs);
          slidesShell.style.display = "block";

          if (stats.fastestRun && stats.fastestRun.map && stats.fastestRun.map.summary_polyline) {
            renderPolylineToSvg(
              stats.fastestRun.map.summary_polyline,
              "map-fastest-run"
            );
          }
          if (stats.longestRun && stats.longestRun.map && stats.longestRun.map.summary_polyline) {
            renderPolylineToSvg(
              stats.longestRun.map.summary_polyline,
              "map-longest-run"
            );
          }
          if (stats.longestRide && stats.longestRide.map && stats.longestRide.map.summary_polyline) {
            renderPolylineToSvg(
              stats.longestRide.map.summary_polyline,
              "map-longest-ride"
            );
          }
          if (stats.highestElev && stats.highestElev.map && stats.highestElev.map.summary_polyline) {
            renderPolylineToSvg(
              stats.highestElev.map.summary_polyline,
              "map-biggest-climb"
            );
          }
        } catch (err) {
          console.error(err);
          titleEl.textContent = "Something went wrong";
          subtitleEl.textContent = "";
          errorEl.textContent =
            "We couldn't load your stats right now. Check your Strava connection and refresh the page.";
        }
      }

      loginBtn.addEventListener("click", () => {
        window.location.href = "/.netlify/functions/strava?mode=auth";
      });

      loadStats();
    </script>
  </body>
</html>
