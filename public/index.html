<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Strava Wrapped</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: #000000;
        --text: #f9fafb;
        --muted: #9ca3af;
        --accent-pink: #ec4899;
        --accent-orange: #f97316;
        --accent-yellow: #facc15;
        --accent-cyan: #22d3ee;
        --accent-green: #22c55e;
        --accent-blue: #6366f1;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: #000;
        color: var(--text);
        display: flex;
        align-items: stretch;
        justify-content: center;
      }

      .screen {
        position: relative;
        width: 100%;
        max-width: 600px;
        min-height: 100vh;
        margin: 0 auto;
        overflow: hidden;
        background: #000;
      }

      /* Intro / login view */

      .header-row {
        padding: 20px 20px 8px;
        text-align: center;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        font-size: 10px;
        color: var(--muted);
        margin-bottom: 12px;
      }

      .pill-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: radial-gradient(circle at 30% 30%, #fff, #f97316, #ec4899);
      }

      #title {
        margin: 0 0 6px;
        font-size: 26px;
        font-weight: 800;
        text-transform: lowercase;
      }

      #subtitle {
        margin: 0;
        font-size: 14px;
        color: var(--muted);
      }

      .login-wrapper {
        margin-top: 18px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 24px;
        border-radius: 999px;
        border: none;
        outline: none;
        text-decoration: none;
        font-size: 14px;
        font-weight: 700;
        color: #020617;
        background-image: linear-gradient(
          135deg,
          #f9fafb,
          #fbbf24,
          #22c55e
        );
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.95);
        cursor: pointer;
        white-space: nowrap;
      }

      .btn span:first-child {
        margin-right: 8px;
        font-size: 18px;
      }

      /* Slides view */

      .slides-shell {
        display: none;
        height: 100vh;
        width: 100%;
      }

      .slides-frame {
        position: relative;
        height: 100%;
        width: 100%;
        overflow: hidden;
        touch-action: pan-y;
      }

      .slides-container {
        position: relative;
        height: 100%;
        width: 100%;
      }

      .slide {
        position: absolute;
        inset: 0;
        opacity: 0;
        pointer-events: none;
        transition: opacity 250ms ease-out;
        display: flex;
      }

      .slide.active {
        opacity: 1;
        pointer-events: auto;
      }

      .slide-inner {
        position: relative;
        width: 100%;
        height: 100%;
        background: #000;
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 18vh 20px 16vh;
        overflow: hidden;
      }

      .slide-inner::before,
      .slide-inner::after {
        content: "";
        position: absolute;
        pointer-events: none;
        z-index: 0;
      }

      /* Spotify-style glowing ribbons */

      .slide-inner--overview::before {
        top: -35%;
        left: -35%;
        width: 160%;
        height: 55%;
        background: linear-gradient(135deg, #f97316, #ec4899);
        filter: blur(10px);
      }

      .slide-inner--overview::after {
        bottom: -35%;
        right: -35%;
        width: 160%;
        height: 55%;
        background: linear-gradient(315deg, #ec4899, #22d3ee);
        filter: blur(10px);
      }

      .slide-inner--fastest::before {
        top: -35%;
        left: -35%;
        width: 160%;
        height: 55%;
        background: linear-gradient(135deg, #ec4899, #6366f1);
        filter: blur(10px);
      }

      .slide-inner--fastest::after {
        bottom: -35%;
        right: -35%;
        width: 160%;
        height: 55%;
        background: linear-gradient(315deg, #6366f1, #22c55e);
        filter: blur(10px);
      }

      .slide-inner--longrun::before {
        top: -35%;
        left: -35%;
        width: 160%;
        height: 55%;
        background: linear-gradient(135deg, #22d3ee, #6366f1);
        filter: blur(10px);
      }

      .slide-inner--longrun::after {
        bottom: -35%;
        right: -35%;
        width: 160%;
        height: 55%;
        background: linear-gradient(315deg, #6366f1, #facc15);
        filter: blur(10px);
      }

      .slide-inner--ride::before {
        top: -35%;
        left: -35%;
        width: 160%;
        height: 55%;
        background: linear-gradient(135deg, #22c55e, #0ea5e9);
        filter: blur(10px);
      }

      .slide-inner--ride::after {
        bottom: -35%;
        right: -35%;
        width: 160%;
        height: 55%;
        background: linear-gradient(315deg, #0ea5e9, #f97316);
        filter: blur(10px);
      }

      .slide-inner--climb::before {
        top: -35%;
        left: -35%;
        width: 160%;
        height: 55%;
        background: linear-gradient(135deg, #f97316, #facc15);
        filter: blur(10px);
      }

      .slide-inner--climb::after {
        bottom: -35%;
        right: -35%;
        width: 160%;
        height: 55%;
        background: linear-gradient(315deg, #facc15, #ec4899);
        filter: blur(10px);
      }

      .slide-body {
        position: relative;
        z-index: 1;
        max-width: 90%;
        margin: 0 auto;
      }

      .slide-label {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        margin-bottom: 10px;
      }

      .slide-metric {
        font-size: clamp(52px, 18vw, 86px);
        font-weight: 900;
        line-height: 1.02;
        margin-bottom: 10px;
      }

      .slide-metric-unit {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 14px;
      }

      .slide-line {
        font-size: 15px;
        margin: 3px 0;
      }

      .slide-line strong {
        font-weight: 700;
      }

      .map-chip {
        position: absolute;
        top: 10vh;
        right: 8vw;
        width: 32vw;
        max-width: 180px;
        aspect-ratio: 4 / 3;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.95);
        z-index: 1;
      }

      .route-map {
        width: 100%;
        height: 100%;
      }

      .route-map-bg {
        fill: rgba(15, 23, 42, 0.98);
      }

      .route-map-path {
        fill: none;
        stroke: #facc15;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .route-map-overlay {
        fill: none;
        stroke: rgba(15, 23, 42, 0.9);
        stroke-width: 0.6;
      }

      /* Dots & hint at bottom */

      .slides-footer {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 18px;
        padding: 0 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        z-index: 5;
      }

      .dots {
        display: flex;
        gap: 6px;
        align-items: center;
        justify-content: center;
        flex: 1;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        border: none;
        padding: 0;
        background: rgba(148, 163, 184, 0.7);
        cursor: pointer;
      }

      .dot.active {
        width: 22px;
        background: #f9fafb;
      }

      .slides-hint {
        font-size: 11px;
        color: var(--muted);
        text-align: right;
        white-space: nowrap;
      }

      .error {
        color: #fecaca;
        font-size: 13px;
        padding: 6px 16px 0;
      }

      .footer {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 4px;
        text-align: center;
        font-size: 10px;
        color: var(--muted);
        opacity: 0.8;
      }

      @media (min-width: 768px) {
        .screen {
          max-width: 640px;
        }
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <!-- Intro / login -->
      <header class="header-row" id="intro-header">
        <div class="pill">
          <span class="pill-dot"></span>
          <span>Strava Wrapped · Last 12 months</span>
        </div>
        <h1 id="title">loading your year in motion…</h1>
        <p id="subtitle"></p>
        <div id="login-section" class="login-wrapper" style="display:none;">
          <button id="login-btn" class="btn">
            <span>🎧</span><span>Log in with Strava</span>
          </button>
        </div>
      </header>

      <!-- Slides -->
      <main id="slides-shell" class="slides-shell">
        <div class="slides-frame" id="slides-frame">
          <div id="slides-container" class="slides-container"></div>
          <div class="slides-footer">
            <div id="dots" class="dots"></div>
            <div class="slides-hint">Auto-advancing · swipe or tap dots →</div>
          </div>
        </div>
      </main>

      <div id="error" class="error"></div>
      <div class="footer">
        Prototype only. Uses Strava OAuth via Netlify Functions. Distances in miles, pace in min/mi.
      </div>
    </div>

    <script>
      const loginBtn = document.getElementById("login-btn");
      const loginSection = document.getElementById("login-section");
      const slidesShell = document.getElementById("slides-shell");
      const slidesContainer = document.getElementById("slides-container");
      const dotsContainer = document.getElementById("dots");
      const titleEl = document.getElementById("title");
      const subtitleEl = document.getElementById("subtitle");
      const errorEl = document.getElementById("error");
      const slidesFrameEl = document.getElementById("slides-frame");
      const introHeaderEl = document.getElementById("intro-header");

      let slides = [];
      let currentIndex = 0;
      let autoTimer = null;

      function metersToMiles(meters) {
        return meters / 1609.34;
      }

      function formatMiles(meters, decimals = 1) {
        return metersToMiles(meters).toFixed(decimals);
      }

      function formatHours(seconds) {
        return (seconds / 3600).toFixed(1);
      }

      // backend returns fastestPace as sec per km; convert to sec per mile
      function formatPaceFromSecPerKm(secPerKm) {
        if (!secPerKm || !isFinite(secPerKm)) return "-";
        const secPerMile = secPerKm * 1.609344;
        const minTotal = secPerMile / 60;
        const min = Math.floor(minTotal);
        const sec = Math.round((minTotal - min) * 60)
          .toString()
          .padStart(2, "0");
        return `${min}:${sec} / mi`;
      }

      function monthLabel(ym) {
        const [year, m] = ym.split("-");
        const monthNames = [
          "Jan","Feb","Mar","Apr","May","Jun",
          "Jul","Aug","Sep","Oct","Nov","Dec"
        ];
        return `${monthNames[parseInt(m, 10) - 1]} ${year}`;
      }

      // Polyline decode
      function decodePolyline(str) {
        const coords = [];
        let index = 0;
        let lat = 0;
        let lng = 0;

        while (index < str.length) {
          let result = 0;
          let shift = 0;
          let b;
          do {
            b = str.charCodeAt(index++) - 63;
            result |= (b & 0x1f) << shift;
            shift += 5;
          } while (b >= 0x20);
          const dlat = (result & 1) ? ~(result >> 1) : (result >> 1);
          lat += dlat;

          result = 0;
          shift = 0;
          do {
            b = str.charCodeAt(index++) - 63;
            result |= (b & 0x1f) << shift;
            shift += 5;
          } while (b >= 0x20);
          const dlng = (result & 1) ? ~(result >> 1) : (result >> 1);
          lng += dlng;

          coords.push([lat * 1e-5, lng * 1e-5]);
        }

        return coords;
      }

      function renderPolylineToSvg(polyline, svgId) {
        if (!polyline) return;
        const svg = document.getElementById(svgId);
        if (!svg) return;

        let coords;
        try {
          coords = decodePolyline(polyline);
        } catch (e) {
          console.warn("Failed to decode polyline", e);
          return;
        }
        if (!coords.length) return;

        let minLat = Infinity,
          maxLat = -Infinity,
          minLng = Infinity,
          maxLng = -Infinity;
        for (const [lat, lng] of coords) {
          if (lat < minLat) minLat = lat;
          if (lat > maxLat) maxLat = lat;
          if (lng < minLng) minLng = lng;
          if (lng > maxLng) maxLng = lng;
        }

        const width = 100;
        const height = 60;
        const lngSpan = maxLng - minLng || 1;
        const latSpan = maxLat - minLat || 1;

        const d = coords
          .map(([lat, lng], idx) => {
            const x = ((lng - minLng) / lngSpan) * width;
            const y = height - ((lat - minLat) / latSpan) * height;
            return `${idx === 0 ? "M" : "L"} ${x.toFixed(2)} ${y.toFixed(2)}`;
          })
          .join(" ");

        const path = svg.querySelector(".route-map-path");
        if (path) {
          path.setAttribute("d", d);
        }
      }

      function buildSlides(athleteName, stats) {
        const s = [];
        const milesTotal = formatMiles(stats.totalDistance, 1);
        const hoursTotal = formatHours(stats.totalMovingTime);

        // Overview slide
        s.push({
          id: "overview",
          html: `
            <div class="slide-inner slide-inner--overview">
              <div class="slide-body">
                <div class="slide-label">My miles this year</div>
                <div class="slide-metric">${milesTotal}</div>
                <div class="slide-metric-unit">miles</div>
                <p class="slide-line">
                  Biggest month: ${
                    stats.peakMonth
                      ? `<strong>${monthLabel(stats.peakMonth)}</strong> with ${formatMiles(
                          stats.peakDistance,
                          1
                        )} mi`
                      : "—"
                  }
                </p>
                <p class="slide-line">
                  Total moving time: <strong>${hoursTotal}</strong> hours
                </p>
              </div>
            </div>
          `
        });

        if (stats.fastestRun && stats.fastestPace) {
          s.push({
            id: "fastest-run",
            html: `
              <div class="slide-inner slide-inner--fastest">
                <div class="slide-body">
                  <div class="slide-label">Fastest run</div>
                  <div class="slide-metric">${formatPaceFromSecPerKm(
                    stats.fastestPace
                  )}</div>
                  <div class="slide-metric-unit">${
                    stats.fastestRun.name || ""
                  }</div>
                  <p class="slide-line">
                    Distance: <strong>${formatMiles(
                      stats.fastestRun.distance,
                      2
                    )} mi</strong>
                  </p>
                  <p class="slide-line">
                    Elevation gain: <strong>${
                      stats.fastestRun.total_elevation_gain
                        ? Math.round(
                            stats.fastestRun.total_elevation_gain * 3.28084
                          ) + " ft"
                        : "—"
                    }</strong>
                  </p>
                </div>
                ${
                  stats.fastestRun.map &&
                  stats.fastestRun.map.summary_polyline
                    ? `
                    <div class="map-chip">
                      <svg id="map-fastest-run" class="route-map" viewBox="0 0 100 60" preserveAspectRatio="xMidYMid meet">
                        <rect class="route-map-bg" x="0" y="0" width="100" height="60"></rect>
                        <path class="route-map-path" d=""></path>
                        <path class="route-map-overlay" d=""></path>
                      </svg>
                    </div>
                  `
                    : ""
                }
              </div>
            `
          });
        }

        if (stats.longestRun) {
          s.push({
            id: "longest-run",
            html: `
              <div class="slide-inner slide-inner--longrun">
                <div class="slide-body">
                  <div class="slide-label">Longest run</div>
                  <div class="slide-metric">${formatMiles(
                    stats.longestRun.distance,
                    2
                  )}</div>
                  <div class="slide-metric-unit">miles</div>
                  <p class="slide-line">
                    Elevation gain: <strong>${
                      stats.longestRun.total_elevation_gain
                        ? Math.round(
                            stats.longestRun.total_elevation_gain * 3.28084
                          ) + " ft"
                        : "—"
                    }</strong>
                  </p>
                  <p class="slide-line">
                    Type: <strong>${stats.longestRun.type || "Run"}</strong>
                  </p>
                </div>
                ${
                  stats.longestRun.map &&
                  stats.longestRun.map.summary_polyline
                    ? `
                    <div class="map-chip">
                      <svg id="map-longest-run" class="route-map" viewBox="0 0 100 60" preserveAspectRatio="xMidYMid meet">
                        <rect class="route-map-bg" x="0" y="0" width="100" height="60"></rect>
                        <path class="route-map-path" d=""></path>
                        <path class="route-map-overlay" d=""></path>
                      </svg>
                    </div>
                  `
                    : ""
                }
              </div>
            `
          });
        }

        if (stats.longestRide) {
          s.push({
            id: "longest-ride",
            html: `
              <div class="slide-inner slide-inner--ride">
                <div class="slide-body">
                  <div class="slide-label">Longest ride</div>
                  <div class="slide-metric">${formatMiles(
                    stats.longestRide.distance,
                    2
                  )}</div>
                  <div class="slide-metric-unit">miles</div>
                  <p class="slide-line">
                    Elevation gain: <strong>${
                      stats.longestRide.total_elevation_gain
                        ? Math.round(
                            stats.longestRide.total_elevation_gain * 3.28084
                          ) + " ft"
                        : "—"
                    }</strong>
                  </p>
                  <p class="slide-line">
                    Type: <strong>${stats.longestRide.type || "Ride"}</strong>
                  </p>
                </div>
                ${
                  stats.longestRide.map &&
                  stats.longestRide.map.summary_polyline
                    ? `
                    <div class="map-chip">
                      <svg id="map-longest-ride" class="route-map" viewBox="0 0 100 60" preserveAspectRatio="xMidYMid meet">
                        <rect class="route-map-bg" x="0" y="0" width="100" height="60"></rect>
                        <path class="route-map-path" d=""></path>
                        <path class="route-map-overlay" d=""></path>
                      </svg>
                    </div>
                  `
                    : ""
                }
              </div>
            `
          });
        }

        if (stats.highestElev) {
          s.push({
            id: "biggest-climb",
            html: `
              <div class="slide-inner slide-inner--climb">
                <div class="slide-body">
                  <div class="slide-label">Biggest climb day</div>
                  <div class="slide-metric">${Math.round(
                    stats.highestElev.total_elevation_gain * 3.28084
                  )}</div>
                  <div class="slide-metric-unit">feet climbed</div>
                  <p class="slide-line">
                    Distance: <strong>${formatMiles(
                      stats.highestElev.distance,
                      2
                    )} mi</strong>
                  </p>
                  <p class="slide-line">
                    Type: <strong>${stats.highestElev.type || "Activity"}</strong>
                  </p>
                </div>
                ${
                  stats.highestElev.map &&
                  stats.highestElev.map.summary_polyline
                    ? `
                    <div class="map-chip">
                      <svg id="map-biggest-climb" class="route-map" viewBox="0 0 100 60" preserveAspectRatio="xMidYMid meet">
                        <rect class="route-map-bg" x="0" y="0" width="100" height="60"></rect>
                        <path class="route-map-path" d=""></path>
                        <path class="route-map-overlay" d=""></path>
                      </svg>
                    </div>
                  `
                    : ""
                }
              </div>
            `
          });
        }

        return s;
      }

      function renderSlides(slideDefs) {
        slides = slideDefs;
        currentIndex = 0;

        slidesContainer.innerHTML = slideDefs
          .map(
            (s, idx) => `
          <section class="slide ${idx === 0 ? "active" : ""}" data-index="${idx}">
            ${s.html}
          </section>
        `
          )
          .join("");

        dotsContainer.innerHTML = slideDefs
          .map(
            (_, idx) =>
              `<button class="dot ${idx === 0 ? "active" : ""}" data-index="${idx}"></button>`
          )
          .join("");

        const dots = Array.from(dotsContainer.querySelectorAll(".dot"));
        dots.forEach((dot) => {
          dot.addEventListener("click", () => {
            const i = Number(dot.getAttribute("data-index"));
            goToSlide(i, true);
          });
        });

        if (autoTimer) clearInterval(autoTimer);
        autoTimer = setInterval(() => {
          goToSlide((currentIndex + 1) % slides.length, false);
        }, 6500);
      }

      function goToSlide(index, fromUser) {
        if (!slides.length) return;
        if (index < 0) index = slides.length - 1;
        if (index >= slides.length) index = 0;
        currentIndex = index;

        const slideEls = Array.from(slidesContainer.querySelectorAll(".slide"));
        slideEls.forEach((el, idx) => {
          el.classList.toggle("active", idx === currentIndex);
        });

        const dotEls = Array.from(dotsContainer.querySelectorAll(".dot"));
        dotEls.forEach((el, idx) => {
          el.classList.toggle("active", idx === currentIndex);
        });

        if (fromUser && autoTimer) {
          clearInterval(autoTimer);
          autoTimer = setInterval(() => {
            goToSlide((currentIndex + 1) % slides.length, false);
          }, 6500);
        }
      }

      // Swipe handling
      let touchStartX = 0;
      let touchStartY = 0;
      let touchEndX = 0;
      let touchEndY = 0;

      function handleTouchStart(e) {
        if (!e.touches || !e.touches.length) return;
        const t = e.touches[0];
        touchStartX = t.clientX;
        touchStartY = t.clientY;
        touchEndX = t.clientX;
        touchEndY = t.clientY;
      }

      function handleTouchMove(e) {
        if (!e.touches || !e.touches.length) return;
        const t = e.touches[0];
        touchEndX = t.clientX;
        touchEndY = t.clientY;
      }

      function handleTouchEnd() {
        const dx = touchEndX - touchStartX;
        const dy = touchEndY - touchStartY;
        const threshold = 40;

        if (Math.abs(dx) > threshold && Math.abs(dx) > Math.abs(dy)) {
          if (dx < 0) {
            goToSlide(currentIndex + 1, true); // left → next
          } else {
            goToSlide(currentIndex - 1, true); // right → prev
          }
        }
      }

      if (slidesFrameEl) {
        slidesFrameEl.addEventListener("touchstart", handleTouchStart, {
          passive: true
        });
        slidesFrameEl.addEventListener("touchmove", handleTouchMove, {
          passive: true
        });
        slidesFrameEl.addEventListener("touchend", handleTouchEnd);
      }

      async function loadStats() {
        errorEl.textContent = "";
        loginSection.style.display = "none";
        slidesShell.style.display = "none";

        try {
          const res = await fetch("/.netlify/functions/strava?mode=stats", {
            credentials: "include"
          });

          if (res.status === 401) {
            titleEl.textContent = "your strava wrapped.";
            subtitleEl.textContent =
              "Tap to connect Strava and see your year like a Spotify Wrapped for miles.";
            loginSection.style.display = "block";
            return;
          }

          if (!res.ok) {
            throw new Error("Failed to load stats");
          }

          const data = await res.json();
          const { athleteName, stats } = data;

          titleEl.textContent = `${(athleteName || "Athlete").toLowerCase()}, this is your year in motion.`;
          subtitleEl.textContent = "Swipe to start your recap.";

          const defs = buildSlides(athleteName, stats);
          if (!defs.length) {
            subtitleEl.textContent =
              "We couldn't find enough activity data for the last year. Try again after you log more workouts.";
            return;
          }

          renderSlides(defs);
          slidesShell.style.display = "block";

          // Hide intro header once slides are ready: full-screen poster
          if (introHeaderEl) {
            introHeaderEl.style.display = "none";
          }

          if (stats.fastestRun && stats.fastestRun.map && stats.fastestRun.map.summary_polyline) {
            renderPolylineToSvg(
              stats.fastestRun.map.summary_polyline,
              "map-fastest-run"
            );
          }
          if (stats.longestRun && stats.longestRun.map && stats.longestRun.map.summary_polyline) {
            renderPolylineToSvg(
              stats.longestRun.map.summary_polyline,
              "map-longest-run"
            );
          }
          if (stats.longestRide && stats.longestRide.map && stats.longestRide.map.summary_polyline) {
            renderPolylineToSvg(
              stats.longestRide.map.summary_polyline,
              "map-longest-ride"
            );
          }
          if (stats.highestElev && stats.highestElev.map && stats.highestElev.map.summary_polyline) {
            renderPolylineToSvg(
              stats.highestElev.map.summary_polyline,
              "map-biggest-climb"
            );
          }
        } catch (err) {
          console.error(err);
          titleEl.textContent = "something went wrong";
          subtitleEl.textContent = "";
          errorEl.textContent =
            "We couldn't load your stats right now. Check your Strava connection and refresh.";
        }
      }

      loginBtn.addEventListener("click", () => {
        window.location.href = "/.netlify/functions/strava?mode=auth";
      });

      loadStats();
    </script>
  </body>
</html>
