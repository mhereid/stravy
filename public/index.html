<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Strava Wrapped</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: #020617;
        --accent1: #f97316;
        --accent2: #ec4899;
        --accent3: #6366f1;
        --accent4: #22c55e;
        --text: #f9fafb;
        --muted: #9ca3af;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 0% 0%, #a855f7 0, transparent 55%),
          radial-gradient(circle at 100% 0%, #22c55e 0, transparent 55%),
          radial-gradient(circle at 0% 100%, #f97316 0, transparent 60%),
          radial-gradient(circle at 100% 100%, #0ea5e9 0, #020617 65%);
        display: flex;
        align-items: stretch;
        justify-content: center;
      }

      .shell {
        width: 100%;
        max-width: 1100px;
        padding: 16px;
        margin: auto;
      }

      .card {
        width: 100%;
        min-height: min(640px, 100vh - 32px);
        border-radius: 40px;
        padding: 24px 24px 20px;
        display: flex;
        flex-direction: column;
        background:
          conic-gradient(
            from 160deg,
            rgba(248, 250, 252, 0.18),
            rgba(15, 23, 42, 0.98),
            rgba(30, 64, 175, 0.98),
            rgba(15, 23, 42, 1),
            rgba(248, 250, 252, 0.08)
          );
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.22);
      }

      .header-row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-start;
        margin-bottom: 18px;
      }

      .heading-block {
        max-width: 70%;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        text-transform: uppercase;
        letter-spacing: 0.17em;
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 10px;
      }
      .pill-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: linear-gradient(
          135deg,
          var(--accent1),
          var(--accent2),
          var(--accent3)
        );
      }

      h1 {
        font-size: 36px;
        line-height: 1.05;
        margin: 0 0 6px;
      }
      .sub {
        font-size: 14px;
        color: var(--muted);
        margin: 0;
      }

      .login-wrapper {
        margin-top: 10px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 24px;
        border-radius: 999px;
        border: none;
        outline: none;
        text-decoration: none;
        font-size: 14px;
        font-weight: 650;
        color: #0b1120;
        background-image: linear-gradient(
          135deg,
          #f9fafb,
          #e5e7eb,
          #fbbf24,
          #22c55e
        );
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.95);
        cursor: pointer;
        white-space: nowrap;
      }
      .btn span:first-child {
        margin-right: 8px;
        font-size: 18px;
      }

      .slides-shell {
        flex: 1;
        display: flex;
        flex-direction: column;
        margin-top: 10px;
      }

      .slides-frame {
        position: relative;
        flex: 1;
        overflow: hidden;
        border-radius: 28px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        background: radial-gradient(circle at 0% 0%, rgba(248, 250, 252, 0.12), transparent 55%),
          radial-gradient(circle at 100% 100%, rgba(56, 189, 248, 0.22), rgba(15, 23, 42, 0.96));
        padding: 16px 16px 18px;
        min-height: 260px;
      }

      .slides-container {
        position: relative;
        height: 100%;
      }

      .slide {
        opacity: 0;
        pointer-events: none;
        position: absolute;
        inset: 0;
        padding-right: 4px;
        transition: opacity 260ms ease-out;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .slide.active {
        opacity: 1;
        pointer-events: auto;
        position: relative;
      }

      .slide-top {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: flex-start;
      }

      .slide-tag {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .slide-title {
        font-size: 22px;
        font-weight: 750;
        margin-bottom: 4px;
      }
      .slide-main {
        font-size: 34px;
        font-weight: 800;
        margin-bottom: 6px;
      }
      .slide-sub {
        font-size: 14px;
        color: var(--muted);
      }

      .slide-text-block {
        flex: 2;
        min-width: 200px;
      }
      .slide-side-block {
        flex: 1.2;
        min-width: 140px;
        display: flex;
        justify-content: flex-end;
      }

      .stat-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
        gap: 8px 14px;
        margin-top: 10px;
        font-size: 13px;
        color: var(--muted);
      }
      .stat-list strong {
        color: var(--text);
        font-weight: 600;
      }

      .slides-footer {
        margin-top: 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .nav-buttons {
        display: flex;
        gap: 8px;
      }
      .nav-btn {
        width: 32px;
        height: 32px;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.7);
        background: rgba(15, 23, 42, 0.95);
        color: var(--muted);
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .nav-btn:active {
        transform: translateY(1px);
      }

      .dots {
        display: flex;
        gap: 6px;
        align-items: center;
        justify-content: center;
        flex: 1;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        border: none;
        padding: 0;
        background: rgba(148, 163, 184, 0.65);
        cursor: pointer;
      }
      .dot.active {
        width: 22px;
        background: #f9fafb;
      }

      .slides-hint {
        font-size: 11px;
        color: var(--muted);
        text-align: right;
      }

      /* Route maps */
      .route-map {
        width: 100%;
        max-width: 260px;
        aspect-ratio: 4 / 3;
        border-radius: 20px;
        background: radial-gradient(circle at 0% 0%, rgba(56, 189, 248, 0.6), rgba(15, 23, 42, 1));
        box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.9),
          0 18px 40px rgba(15, 23, 42, 0.85);
      }
      .route-map-bg {
        fill: rgba(15, 23, 42, 0.9);
      }
      .route-map-path {
        fill: none;
        stroke: #facc15;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .route-map-overlay {
        fill: none;
        stroke: rgba(15, 23, 42, 0.9);
        stroke-width: 0.6;
      }

      .error {
        color: #fecaca;
        font-size: 13px;
        margin-top: 6px;
      }

      .footer {
        margin-top: 14px;
        font-size: 11px;
        color: var(--muted);
      }

      @media (max-width: 768px) {
        .card {
          border-radius: 32px;
          padding: 18px 16px 16px;
          min-height: calc(100vh - 32px);
        }
        .heading-block {
          max-width: 100%;
        }
        h1 {
          font-size: 28px;
        }
        .slides-frame {
          min-height: 260px;
        }
        .slide-main {
          font-size: 28px;
        }
        .slide-title {
          font-size: 18px;
        }
        .shell {
          padding: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <section class="card">
        <header class="header-row">
          <div class="heading-block">
            <div class="pill">
              <span class="pill-dot"></span>
              <span>Strava Wrapped · Last 12 months</span>
            </div>
            <h1 id="title">Loading your year in motion…</h1>
            <p id="subtitle" class="sub"></p>
          </div>
          <div id="login-section" class="login-wrapper" style="display: none;">
            <button id="login-btn" class="btn">
              <span>🎧</span> <span>Log in with Strava</span>
            </button>
          </div>
        </header>

        <main id="slides-shell" class="slides-shell" style="display: none;">
          <div class="slides-frame">
            <div id="slides-container" class="slides-container"></div>
            <div class="slides-footer">
              <div class="nav-buttons">
                <button id="prev-btn" class="nav-btn" aria-label="Previous slide">
                  ◀
                </button>
                <button id="next-btn" class="nav-btn" aria-label="Next slide">
                  ▶
                </button>
              </div>
              <div id="dots" class="dots"></div>
              <div class="slides-hint">Auto-advancing — tap arrows to jump around →</div>
            </div>
          </div>
        </main>

        <div id="error" class="error"></div>

        <footer class="footer">
          Prototype only. Uses Strava OAuth with tokens stored in a secure HttpOnly cookie via
          Netlify Functions. Distances in miles, pace in min/mi.
        </footer>
      </section>
    </div>

    <script>
      const loginBtn = document.getElementById("login-btn");
      const loginSection = document.getElementById("login-section");
      const slidesShell = document.getElementById("slides-shell");
      const slidesContainer = document.getElementById("slides-container");
      const dotsContainer = document.getElementById("dots");
      const titleEl = document.getElementById("title");
      const subtitleEl = document.getElementById("subtitle");
      const errorEl = document.getElementById("error");

      let slides = [];
      let currentIndex = 0;
      let autoTimer = null;

      function metersToMiles(meters) {
        return meters / 1609.34;
      }
      function formatMiles(meters, decimals = 1) {
        return metersToMiles(meters).toFixed(decimals);
      }
      function formatHours(seconds) {
        return (seconds / 3600).toFixed(1);
      }
      // backend returns fastestPace as sec per km; convert to sec per mile
      function formatPaceFromSecPerKm(secPerKm) {
        if (!secPerKm || !isFinite(secPerKm)) return "-";
        const secPerMile = secPerKm * 1.609344;
        const minTotal = secPerMile / 60;
        const min = Math.floor(minTotal);
        const sec = Math.round((minTotal - min) * 60)
          .toString()
          .padStart(2, "0");
        return `${min}:${sec} / mi`;
      }
      function monthLabel(ym) {
        const [year, m] = ym.split("-");
        const monthNames = [
          "Jan",
          "Feb",
          "Mar",
          "Apr",
          "May",
          "Jun",
          "Jul",
          "Aug",
          "Sep",
          "Oct",
          "Nov",
          "Dec"
        ];
        return `${monthNames[parseInt(m, 10) - 1]} ${year}`;
      }

      // Polyline decode
      function decodePolyline(str) {
        const coords = [];
        let index = 0;
        let lat = 0;
        let lng = 0;

        while (index < str.length) {
          let result = 0;
          let shift = 0;
          let b;
          do {
            b = str.charCodeAt(index++) - 63;
            result |= (b & 0x1f) << shift;
            shift += 5;
          } while (b >= 0x20);
          const dlat = (result & 1) ? ~(result >> 1) : (result >> 1);
          lat += dlat;

          result = 0;
          shift = 0;
          do {
            b = str.charCodeAt(index++) - 63;
            result |= (b & 0x1f) << shift;
            shift += 5;
          } while (b >= 0x20);
          const dlng = (result & 1) ? ~(result >> 1) : (result >> 1);
          lng += dlng;

          coords.push([lat * 1e-5, lng * 1e-5]);
        }

        return coords;
      }

      function renderPolylineToSvg(polyline, svgId) {
        if (!polyline) return;
        const svg = document.getElementById(svgId);
        if (!svg) return;

        let coords;
        try {
          coords = decodePolyline(polyline);
        } catch (e) {
          console.warn("Failed to decode polyline", e);
          return;
        }
        if (!coords.length) return;

        let minLat = Infinity,
          maxLat = -Infinity,
          minLng = Infinity,
          maxLng = -Infinity;
        for (const [lat, lng] of coords) {
          if (lat < minLat) minLat = lat;
          if (lat > maxLat) maxLat = lat;
          if (lng < minLng) minLng = lng;
          if (lng > maxLng) maxLng = lng;
        }

        const width = 100;
        const height = 60;
        const lngSpan = maxLng - minLng || 1;
        const latSpan = maxLat - minLat || 1;

        const d = coords
          .map(([lat, lng], idx) => {
            const x = ((lng - minLng) / lngSpan) * width;
            const y = height - ((lat - minLat) / latSpan) * height;
            return `${idx === 0 ? "M" : "L"} ${x.toFixed(2)} ${y.toFixed(2)}`;
          })
          .join(" ");

        const path = svg.querySelector(".route-map-path");
        if (path) {
          path.setAttribute("d", d);
        }
      }

      function buildSlides(athleteName, stats) {
        const s = [];
        const milesTotal = formatMiles(stats.totalDistance, 1);
        const hoursTotal = formatHours(stats.totalMovingTime);

        s.push({
          id: "overview",
          html: `
            <div class="slide-top">
              <div class="slide-text-block">
                <div class="slide-tag">Overview</div>
                <div class="slide-title">${athleteName || "Athlete"}, here’s your year in motion.</div>
                <div class="slide-main">${milesTotal} miles</div>
                <div class="slide-sub">
                  logged across your runs and rides in the last 12 months — about ${hoursTotal} hours on the move.
                </div>
                <div class="stat-list">
                  <div><strong>Total time</strong><br>${hoursTotal} hours moving</div>
                  ${
                    stats.peakMonth
                      ? `<div><strong>Peak month</strong><br>${monthLabel(
                          stats.peakMonth
                        )} · ${formatMiles(
                          stats.peakDistance,
                          1
                        )} mi</div>`
                      : ""
                  }
                  ${
                    stats.fastestRun
                      ? `<div><strong>Fastest effort</strong><br>${
                          stats.fastestRun.name || "Fastest run"
                        }</div>`
                      : ""
                  }
                </div>
              </div>
            </div>
          `
        });

        if (stats.fastestRun && stats.fastestPace) {
          s.push({
            id: "fastest-run",
            html: `
              <div class="slide-top">
                <div class="slide-text-block">
                  <div class="slide-tag">Fastest Run</div>
                  <div class="slide-title">${
                    stats.fastestRun.name || "Fastest run"
                  }</div>
                  <div class="slide-main">${formatPaceFromSecPerKm(
                    stats.fastestPace
                  )}</div>
                  <div class="slide-sub">
                    over ${formatMiles(
                      stats.fastestRun.distance,
                      1
                    )} miles. This was your top-end speed day of the year.
                  </div>
                  <div class="stat-list">
                    <div><strong>Distance</strong><br>${formatMiles(
                      stats.fastestRun.distance,
                      2
                    )} mi</div>
                    <div><strong>Elevation</strong><br>${
                      stats.fastestRun.total_elevation_gain
                        ? Math.round(
                            stats.fastestRun.total_elevation_gain * 3.28084
                          ) + " ft"
                        : "—"
                    }</div>
                  </div>
                </div>
                <div class="slide-side-block">
                  ${
                    stats.fastestRun.map &&
                    stats.fastestRun.map.summary_polyline
                      ? `
                    <svg id="map-fastest-run" class="route-map" viewBox="0 0 100 60" preserveAspectRatio="xMidYMid meet">
                      <rect class="route-map-bg" x="0" y="0" width="100" height="60"></rect>
                      <path class="route-map-path" d=""></path>
                      <path class="route-map-overlay" d=""></path>
                    </svg>
                  `
                      : "<div class='slide-sub'>No route map available for this effort.</div>"
                  }
                </div>
              </div>
            `
          });
        }

        if (stats.longestRun) {
          s.push({
            id: "longest-run",
            html: `
              <div class="slide-top">
                <div class="slide-text-block">
                  <div class="slide-tag">Endurance</div>
                  <div class="slide-title">${
                    stats.longestRun.name || "Longest run"
                  }</div>
                  <div class="slide-main">${formatMiles(
                    stats.longestRun.distance,
                    2
                  )} miles</div>
                  <div class="slide-sub">
                    Your single longest run of the year — the day you just kept going.
                  </div>
                  <div class="stat-list">
                    <div><strong>Elevation gain</strong><br>${
                      stats.longestRun.total_elevation_gain
                        ? Math.round(
                            stats.longestRun.total_elevation_gain * 3.28084
                          ) + " ft"
                        : "—"
                    }</div>
                    <div><strong>Type</strong><br>${
                      stats.longestRun.type || "Run"
                    }</div>
                  </div>
                </div>
                <div class="slide-side-block">
                  ${
                    stats.longestRun.map &&
                    stats.longestRun.map.summary_polyline
                      ? `
                    <svg id="map-longest-run" class="route-map" viewBox="0 0 100 60" preserveAspectRatio="xMidYMid meet">
                      <rect class="route-map-bg" x="0" y="0" width="100" height="60"></rect>
                      <path class="route-map-path" d=""></path>
                      <path class="route-map-overlay" d=""></path>
                    </svg>
                  `
                      : "<div class='slide-sub'>No route map available for this run.</div>"
                  }
                </div>
              </div>
            `
          });
        }

        if (stats.longestRide) {
          s.push({
            id: "longest-ride",
            html: `
              <div class="slide-top">
                <div class="slide-text-block">
                  <div class="slide-tag">Big Ride</div>
                  <div class="slide-title">${
                    stats.longestRide.name || "Longest ride"
                  }</div>
                  <div class="slide-main">${formatMiles(
                    stats.longestRide.distance,
                    2
                  )} miles</div>
                  <div class="slide-sub">
                    Your longest day in the saddle — the ride that defined your year on two wheels.
                  </div>
                  <div class="stat-list">
                    <div><strong>Elevation gain</strong><br>${
                      stats.longestRide.total_elevation_gain
                        ? Math.round(
                            stats.longestRide.total_elevation_gain * 3.28084
                          ) + " ft"
                        : "—"
                    }</div>
                    <div><strong>Type</strong><br>${
                      stats.longestRide.type || "Ride"
                    }</div>
                  </div>
                </div>
                <div class="slide-side-block">
                  ${
                    stats.longestRide.map &&
                    stats.longestRide.map.summary_polyline
                      ? `
                    <svg id="map-longest-ride" class="route-map" viewBox="0 0 100 60" preserveAspectRatio="xMidYMid meet">
                      <rect class="route-map-bg" x="0" y="0" width="100" height="60"></rect>
                      <path class="route-map-path" d=""></path>
                      <path class="route-map-overlay" d=""></path>
                    </svg>
                  `
                      : "<div class='slide-sub'>No route map available for this ride.</div>"
                  }
                </div>
              </div>
            `
          });
        }

        if (stats.highestElev) {
          s.push({
            id: "biggest-climb",
            html: `
              <div class="slide-top">
                <div class="slide-text-block">
                  <div class="slide-tag">Biggest Climb Day</div>
                  <div class="slide-title">${
                    stats.highestElev.name || "Biggest climb"
                  }</div>
                  <div class="slide-main">${Math.round(
                    stats.highestElev.total_elevation_gain * 3.28084
                  )} ft</div>
                  <div class="slide-sub">
                    The day you climbed the most vertical — legs screaming, views earned.
                  </div>
                  <div class="stat-list">
                    <div><strong>Distance</strong><br>${formatMiles(
                      stats.highestElev.distance,
                      2
                    )} mi</div>
                    <div><strong>Type</strong><br>${
                      stats.highestElev.type || "Activity"
                    }</div>
                  </div>
                </div>
                <div class="slide-side-block">
                  ${
                    stats.highestElev.map &&
                    stats.highestElev.map.summary_polyline
                      ? `
                    <svg id="map-biggest-climb" class="route-map" viewBox="0 0 100 60" preserveAspectRatio="xMidYMid meet">
                      <rect class="route-map-bg" x="0" y="0" width="100" height="60"></rect>
                      <path class="route-map-path" d=""></path>
                      <path class="route-map-overlay" d=""></path>
                    </svg>
                  `
                      : "<div class='slide-sub'>No route map available for this climb day.</div>"
                  }
                </div>
              </div>
            `
          });
        }

        return s;
      }

      function renderSlides(slideDefs) {
        slides = slideDefs;
        currentIndex = 0;
        slidesContainer.innerHTML = slideDefs
          .map(
            (s, idx) => `
          <section class="slide ${idx === 0 ? "active" : ""}" data-index="${idx}">
            ${s.html}
          </section>
        `
          )
          .join("");

        dotsContainer.innerHTML = slideDefs
          .map(
            (_, idx) =>
              `<button class="dot ${idx === 0 ? "active" : ""}" data-index="${idx}"></button>`
          )
          .join("");

        const dots = Array.from(dotsContainer.querySelectorAll(".dot"));
        dots.forEach((dot) => {
          dot.addEventListener("click", () => {
            const i = Number(dot.getAttribute("data-index"));
            goToSlide(i, true);
          });
        });

        if (autoTimer) clearInterval(autoTimer);
        autoTimer = setInterval(() => {
          goToSlide((currentIndex + 1) % slides.length, false);
        }, 6500);
      }

      function goToSlide(index, fromUser) {
        if (!slides.length) return;
        if (index < 0) index = slides.length - 1;
        if (index >= slides.length) index = 0;
        currentIndex = index;

        const slideEls = Array.from(slidesContainer.querySelectorAll(".slide"));
        slideEls.forEach((el, idx) => {
          el.classList.toggle("active", idx === currentIndex);
        });

        const dotEls = Array.from(dotsContainer.querySelectorAll(".dot"));
        dotEls.forEach((el, idx) => {
          el.classList.toggle("active", idx === currentIndex);
        });

        if (fromUser && autoTimer) {
          clearInterval(autoTimer);
          autoTimer = setInterval(() => {
            goToSlide((currentIndex + 1) % slides.length, false);
          }, 6500);
        }
      }

      document.getElementById("prev-btn").addEventListener("click", () => {
        goToSlide(currentIndex - 1, true);
      });
      document.getElementById("next-btn").addEventListener("click", () => {
        goToSlide(currentIndex + 1, true);
      });

      async function loadStats() {
        errorEl.textContent = "";
        loginSection.style.display = "none";
        slidesShell.style.display = "none";

        try {
          const res = await fetch("/.netlify/functions/strava?mode=stats", {
            credentials: "include"
          });

          if (res.status === 401) {
            titleEl.textContent = "Your Strava Wrapped";
            subtitleEl.textContent =
              "Tap to connect Strava and watch your year unfold like a Spotify Wrapped, but for miles.";
            loginSection.style.display = "block";
            return;
          }

          if (!res.ok) {
            throw new Error("Failed to load stats");
          }

          const data = await res.json();
          const { athleteName, stats } = data;

          titleEl.textContent = `${athleteName || "Athlete"}, this is your year in motion.`;
          subtitleEl.textContent =
            "Swipe through your personalized Strava Wrapped: total miles, fastest run, longest days, and biggest climbs.";

          const defs = buildSlides(athleteName, stats);
          if (!defs.length) {
            subtitleEl.textContent =
              "We couldn't find enough activity data for the last year. Try again after you log more workouts.";
            return;
          }

          renderSlides(defs);
          slidesShell.style.display = "block";

          if (stats.fastestRun && stats.fastestRun.map && stats.fastestRun.map.summary_polyline) {
            renderPolylineToSvg(
              stats.fastestRun.map.summary_polyline,
              "map-fastest-run"
            );
          }
          if (stats.longestRun && stats.longestRun.map && stats.longestRun.map.summary_polyline) {
            renderPolylineToSvg(
              stats.longestRun.map.summary_polyline,
              "map-longest-run"
            );
          }
          if (stats.longestRide && stats.longestRide.map && stats.longestRide.map.summary_polyline) {
            renderPolylineToSvg(
              stats.longestRide.map.summary_polyline,
              "map-longest-ride"
            );
          }
          if (stats.highestElev && stats.highestElev.map && stats.highestElev.map.summary_polyline) {
            renderPolylineToSvg(
              stats.highestElev.map.summary_polyline,
              "map-biggest-climb"
            );
          }
        } catch (err) {
          console.error(err);
          titleEl.textContent = "Something went wrong";
          subtitleEl.textContent = "";
          errorEl.textContent =
            "We couldn't load your stats right now. Check your Strava connection and refresh the page.";
        }
      }

      loginBtn.addEventListener("click", () => {
        window.location.href = "/.netlify/functions/strava?mode=auth";
      });

      loadStats();
    </script>
  </body>
</html>
